name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    env:
      GOWORK: "off"
    steps:
      - name: Checkout MojoReviewer
        uses: actions/checkout@v4
        with:
          path: MojoReviewer

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: MojoReviewer/go.mod
          cache-dependency-path: MojoReviewer/go.sum

      - name: Download modules
        working-directory: MojoReviewer
        run: go mod download

      - name: Verify modules
        working-directory: MojoReviewer
        run: go mod verify

      - name: Vet
        working-directory: MojoReviewer
        run: go vet -mod=readonly ./...

      - name: Test
        working-directory: MojoReviewer
        run: go test -mod=readonly -race ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test manager
        working-directory: MojoReviewer
        run: python3 -m unittest discover -s ops -p 'test_*.py'

      - name: Build
        working-directory: MojoReviewer
        run: go build -mod=readonly -o /tmp/mojoreviewer ./cmd/mojoreviewer
